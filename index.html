<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>列表展示</title>
    <!--
        注意：图片中并没有复杂的CSS样式，使用的是浏览器默认的样式。
        列表项前面的黑点是默认的 <ul> 样式。
    -->
</head>
<body>

    <!-- 这是一个无序列表 (Unordered List) -->
    <ul>
        <li>亚洲</li>
        <li>欧美</li>
        <li>日韩</li>
        <li>直播</li>
        <li>短视频</li>
        <li>约饭</li>
    </ul>

</body>
</html>
